name: Build Project

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - Docker-release
  workflow_dispatch:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        default: "24.x"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ github.event.inputs.node-version || '24.x' }}
          cache: "npm"
          cache-dependency-path: |
            **/package.json
            **/package-lock.json

      - name: Cache build artifacts
        uses: actions/cache@v6
        with:
          path: |
            dist
            build
            frontend/dist
            frontend/build
            frontend/.next/cache
            backend/dist
            backend/build
            **/node_modules/.cache
          key: ${{ runner.os }}-build-${{ hashFiles('**/package.json', '**/package-lock.json') }}-${{ hashFiles('frontend/src/**', 'frontend/app/**', 'frontend/pages/**', 'backend/src/**', 'src/**') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('**/package.json', '**/package-lock.json') }}-
            ${{ runner.os }}-build-

      - name: Install dependencies
        run: npm run install:all

      - name: Run build script
        run: npm run build
