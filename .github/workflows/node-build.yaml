name: Build Project

on:
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        default: "24.x"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ github.event.inputs.node-version || '24.x' }}
          cache: "npm"
          cache-dependency-path: |
            **/package.json
            **/package-lock.json

      - name: Cache build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist
            build
            frontend/dist
            frontend/build
            frontend/.next/cache
            backend/dist
            backend/build
            **/node_modules/.cache
          key: ${{ runner.os }}-build-${{ hashFiles('**/package.json', '**/package-lock.json') }}-${{ hashFiles('frontend/src/**', 'frontend/app/**', 'frontend/pages/**', 'backend/src/**', 'src/**') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('**/package.json', '**/package-lock.json') }}-
            ${{ runner.os }}-build-

      - name: Install dependencies
        run: npm run install:all

      - name: Run build script
        run: npm run build
