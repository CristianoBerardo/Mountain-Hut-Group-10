name: ${PROJECT_NAME:-Mountain-Hut-prod}

services:
  mountain-hut:
    image: ${DOCKER_USER:-cristianoberardo}/mountain-hut:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/firebase.json
    volumes:
      - ./backend/secrets/mountain-hut-group-10-firebase.json:/app/secrets/firebase.json:ro
